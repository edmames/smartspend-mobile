  <!-- ============ NOTES ============ -->
  <g transform="translate(470,120)">
    <text x="0" y="0" fill="#e2e8f0" font-size="14" font-weight="700">Yang berubah</text>

    <text x="0" y="30" fill="#94a3b8" font-size="12.5">· Tipe: 3 tab — Masuk · Keluar · Transfer (masing-</text>
    <text x="0" y="48" fill="#94a3b8" font-size="12.5">  masing 1/3 lebar). Setor/Tarik DIPINDAH ke layar</text>
    <text x="0" y="66" fill="#94a3b8" font-size="12.5">  Tabungan; di sini hanya ada baris tautan ke sana.</text>

    <text x="0" y="98" fill="#94a3b8" font-size="12.5">· Label dompet ikut arah uang: pengeluaran =</text>
    <text x="0" y="116" fill="#94a3b8" font-size="12.5">  “Diambil dari”, pemasukan = “Disimpan ke”,</text>
    <text x="0" y="134" fill="#94a3b8" font-size="12.5">  transfer = “Dari / Ke”. (Sebelumnya pemasukan</text>
    <text x="0" y="152" fill="#94a3b8" font-size="12.5">  salah dilabeli “Dompet sumber”.)</text>

    <text x="0" y="184" fill="#e2e8f0" font-size="13" font-weight="600">Jumlah + saldo berjalan</text>
    <text x="0" y="204" fill="#94a3b8" font-size="12.5">· Baris meta menampilkan “Saldo sekarang” untuk</text>
    <text x="0" y="222" fill="#94a3b8" font-size="12.5">  pemasukan (nilai naik) dan “Saldo tersedia” untuk</text>
    <text x="0" y="240" fill="#94a3b8" font-size="12.5">  pengeluaran (nilai turun; merah bila jadi minus).</text>

    <text x="0" y="272" fill="#e2e8f0" font-size="13" font-weight="600">Kategori jadi elemen, bukan dropdown</text>
    <text x="0" y="204" fill="#94a3b8" font-size="12.5">· 8 kategori pengeluaran / 6 pemasukan tampil semua</text>
    <text x="0" y="222" fill="#94a3b8" font-size="12.5">  sebagai tile 74×70 (ikon + label), 4 per baris.</text>
    <text x="0" y="240" fill="#94a3b8" font-size="12.5">· Kategori baru: <tspan fill="#e2e8f0">Liburan</tspan> dan <tspan fill="#e2e8f0">Pendidikan</tspan></text>
    <text x="0" y="258" fill="#94a3b8" font-size="12.5">  (memengaruhi laporan &amp; anggaran juga).</text>
    <text x="0" y="276" fill="#94a3b8" font-size="12.5">· Terpilih = tint kategori + border, ikon jadi berwarna.</text>

    <text x="0" y="308" fill="#e2e8f0" font-size="13" font-weight="600">Dompet jadi chip bermark</text>
    <text x="0" y="328" fill="#94a3b8" font-size="12.5">· Chip berisi mark yang sama dengan tab Dompet</text>
    <text x="0" y="346" fill="#94a3b8" font-size="12.5">  (monogram brand bila ada), bisa digeser mendatar.</text>
    <text x="0" y="364" fill="#94a3b8" font-size="12.5">· Transfer: dua baris chip (Dari / Ke), dompet yang</text>
    <text x="0" y="382" fill="#94a3b8" font-size="12.5">  sama otomatis nonaktif. Setor/Tarik: chip target</text>
    <text x="0" y="400" fill="#94a3b8" font-size="12.5">  dengan progres “Rp x / Rp goal”.</text>

    <text x="0" y="432" fill="#e2e8f0" font-size="13" font-weight="600">Sisa form</text>
    <text x="0" y="452" fill="#94a3b8" font-size="12.5">· Tanggal + metode dalam satu baris (metode = chip).</text>
    <text x="0" y="470" fill="#94a3b8" font-size="12.5">· Catatan satu baris (bukan kotak 3 baris).</text>
    <text x="0" y="488" fill="#94a3b8" font-size="12.5">· Baris pratinjau: nominal → dompet tujuan + sisa.</text>
    <text x="0" y="506" fill="#94a3b8" font-size="12.5">· Dropdown (Select) tinggal 0 di form ini; hanya</text>
    <text x="0" y="524" fill="#94a3b8" font-size="12.5">  pemilih tanggal yang tetap membuka sheet kalender.</text>

    <text x="0" y="556" fill="#e2e8f0" font-size="13" font-weight="600">Tinggi form: ±700 px vs ±910 px sebelumnya</text>
  </g>
</svg>
