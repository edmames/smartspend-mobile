  <!-- ================= CATATAN DENSITY ================= -->
  <g transform="translate(470,120)">
    <text x="0" y="0" fill="#e2e8f0" font-size="14" font-weight="700">Yang dipadatkan</text>

    <text x="0" y="30" fill="#94a3b8" font-size="12.5">· Header lama: label “Halo” kecil + nama 24 px</text>
    <text x="0" y="48" fill="#94a3b8" font-size="12.5">  bertumpuk + tombol avatar besar → sekarang satu</text>
    <text x="0" y="66" fill="#94a3b8" font-size="12.5">  baris: inisial 32 px + “Halo, Ahmad” + konteks</text>
    <text x="0" y="84" fill="#94a3b8" font-size="12.5">  (jumlah dompet/tabungan · bulan) + tombol 32 px.</text>

    <text x="0" y="118" fill="#94a3b8" font-size="12.5">· Hero: tinggi 196 px (dari 240), padding 18,</text>
    <text x="0" y="136" fill="#94a3b8" font-size="12.5">  ditambah bar komposisi dompet vs tabungan.</text>

    <text x="0" y="170" fill="#94a3b8" font-size="12.5">· “Bulan ini” jadi 1 kartu 3 kolom berpembatas</text>
    <text x="0" y="188" fill="#94a3b8" font-size="12.5">  hairline (Masuk · Keluar · Net), TANPA mark</text>
    <text x="0" y="206" fill="#94a3b8" font-size="12.5">  hijau/merah: arah dibawa tanda + / − saja.</text>

    <text x="0" y="240" fill="#94a3b8" font-size="12.5">· “Tren 6 bulan” diganti donut “Tren 1 bulan”:</text>
    <text x="0" y="258" fill="#94a3b8" font-size="12.5">  komposisi kategori bulan berjalan (bukan garis</text>
    <text x="0" y="276" fill="#94a3b8" font-size="12.5">  waktu), dengan toggle Pengeluaran/Pemasukan,</text>
    <text x="0" y="294" fill="#94a3b8" font-size="12.5">  total di tengah, 4 kategori + sisa di footer.</text>

    <text x="0" y="274" fill="#94a3b8" font-size="12.5">· Baris kartu dompet 66 px: mark 34, nama 13,</text>
    <text x="0" y="292" fill="#94a3b8" font-size="12.5">  badge tipe, saldo 15, bar share 2 px.</text>

    <text x="0" y="326" fill="#94a3b8" font-size="12.5">· Baris transaksi 44 px (dari 56): ikon 32,</text>
    <text x="0" y="344" fill="#94a3b8" font-size="12.5">  teks 13, meta 11,5 — 5 baris = 264 px.</text>

    <text x="0" y="374" fill="#e2e8f0" font-size="13" font-weight="600">Ikon baris = mark dompetnya</text>
    <text x="0" y="394" fill="#94a3b8" font-size="12.5">· Pengeluaran → mark dompet sumber (GoPay ya</text>
    <text x="0" y="412" fill="#94a3b8" font-size="12.5">  mark GoPay), pemasukan → dompet penerima,</text>
    <text x="0" y="430" fill="#94a3b8" font-size="12.5">  transfer → dompet sumber, setor/tarik → mark</text>
    <text x="0" y="448" fill="#94a3b8" font-size="12.5">  tabungan. Kategori & nama dompet pindah ke</text>
    <text x="0" y="466" fill="#94a3b8" font-size="12.5">  baris meta: “Hari ini · Makanan · GoPay”.</text>

    <text x="0" y="378" fill="#94a3b8" font-size="12.5">· Padding layar 16 (dari 20), antar seksi 16/8.</text>

    <text x="0" y="412" fill="#e2e8f0" font-size="13" font-weight="600">Hasil: Beranda ±1050 px vs ±1330 px sebelumnya</text>
    <text x="0" y="432" fill="#94a3b8" font-size="12.5">(smartphone 390×844 → semua blok utama terlihat</text>
    <text x="0" y="450" fill="#94a3b8" font-size="12.5">tanpa scroll jauh).</text>
  </g>
</svg>
